<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suweger! – Dahaga Melanda? Suweger-in Aja</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <div class="hero">
      <div class="txt">
        <span class="eyebrow">MINUMAN SEGAR, HARGA BERSAHABAT</span>
        <h1>Dahaga melanda?<br />Suweger-in aja.</h1>
        <p>
          Dari Thai Tea dan Matcha sampai kopi, racikan Suweger pas untuk teman
          jeda, teman ngobrol, atau menemani perjalananmu.
        </p>
        <div class="hero-actions">
          <a class="btn" href="drinks.html">Lihat menu</a>
          <a class="text-link" href="about.html">Kenali Suweger <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </div>
    <section class="campaign-carousel" aria-label="Kolaborasi Suweger dengan OMG">
      <div class="carousel-heading">
        <span class="eyebrow">KOLABORASI SUWEGER × OMG</span>
        <h2>Kolaborasi yang bikin segar.</h2>
      </div>
      <div class="carousel-frame" id="campaign-carousel">
        <div class="carousel-track">
          <div class="carousel-slide" aria-hidden="false">
            <img src="assets/collab-omg-1.jpg" alt="Promo kolaborasi Suweger dan OMG Fresh &amp; Beauty Combo" />
          </div>
          <div class="carousel-slide" aria-hidden="true" inert>
            <img src="assets/collab-omg-2.jpg" alt="Kolaborasi produk kecantikan OMG dan Suweger" />
          </div>
          <div class="carousel-slide" aria-hidden="true" inert>
            <img src="assets/collab-omg-3.jpg" alt="Koleksi kolaborasi Suweger dan OMG" />
          </div>
          <div class="carousel-slide" aria-hidden="true" inert>
            <img src="assets/collab-omg-4.jpg" alt="Promo eksklusif kolaborasi Suweger dengan OMG" />
          </div>
        </div>
        <button class="carousel-control carousel-prev" type="button" aria-label="Gambar sebelumnya">‹</button>
        <button class="carousel-control carousel-next" type="button" aria-label="Gambar berikutnya">›</button>
      </div>
      <div class="carousel-footer">
        <div class="carousel-dots" aria-label="Pilih gambar">
          <button type="button" aria-label="Tampilkan gambar 1" aria-current="true"></button>
          <button type="button" aria-label="Tampilkan gambar 2"></button>
          <button type="button" aria-label="Tampilkan gambar 3"></button>
          <button type="button" aria-label="Tampilkan gambar 4"></button>
        </div>
        <span class="carousel-count" aria-live="off"><span class="carousel-current">01</span> / 04</span>
      </div>
    </section>
    <div class="promos" id="promos"></div>
    <div id="site-footer"></div>
    <script src="js/common.js"></script>
    <script src="js/home.js"></script>
    <script src="js/carousel.js"></script>
  </body>
</html>
